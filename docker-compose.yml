services:
  triton:
    build: .
    image: ambient-scribe:latest
    container_name: ambient-scribe
    command: tritonserver --model-repository=/models
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - MBAZA_ASR=DigitalUmuganda/Mbaza-ASR-Afrivoice-660h
      - NEMOTRON_ASR=nvidia/nemotron-3.5-asr-streaming-0.6b
      - NEMOTRON_TARGET_LANG=auto        # or en-US / fr-FR to pin a language
      - NEMOTRON_ATT_CONTEXT_SIZE=[56,13]  # 1.12s lookahead: best WER
    ports:
      - "8000:8000"   # HTTP
      - "8001:8001"   # gRPC
      - "8002:8002"   # metrics
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      - ./model_repository:/models
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v2/health/ready')"]
      interval: 10s
      timeout: 120s
      retries: 10
      start_period: 180s 
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  fastapi:
    build: ./api
    image: ambient-scribe-api:latest
    container_name: fastapi-server
    environment:
      - TRITON_URL=triton:8000      
    volumes:
      - ./api:/app                     # live-edit app.py/utils.py without rebuilding
    ports:
      - "9000:9000"
    depends_on:
      triton:
        condition: service_healthy

